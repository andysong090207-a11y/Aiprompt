name: Android (subway-eta)

on:
  push:
    paths:
      - "subway-eta/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "subway-eta/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subway-eta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 엔진 단위 테스트
        run: ./gradlew :core:test --no-daemon
      - name: APK 빌드
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: subway-eta-debug-apk
          path: subway-eta/app/build/outputs/apk/debug/*.apk
